<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Listen & Point - Vocabulary Game</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-align: center;
      background: #f0f4f8;
      color: #333;
      padding: 20px;
    }
    .controls {
      background: white;
      padding: 15px;
      border-radius: 12px;
      max-width: 900px;
      margin: 0 auto 20px auto;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      display: flex;
      gap: 15px;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
    }
    select, button.action-btn {
      padding: 8px 12px;
      font-size: 0.9rem;
      border-radius: 6px;
      border: 1px solid #ccc;
    }
    .audio-section {
      margin: 20px 0;
    }
    button.start-btn {
      font-size: 1.2rem;
      padding: 12px 24px;
      border-radius: 50px;
      border: none;
      background: #2ed573;
      color: white;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(46, 213, 115, 0.3);
      transition: transform 0.1s, background 0.2s;
    }
    button.start-btn:hover {
      background: #26af5f;
      transform: scale(1.03);
    }
    button.replay-btn {
      font-size: 1rem;
      padding: 10px 20px;
      border-radius: 50px;
      border: none;
      background: #4a90e2;
      color: white;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(74, 144, 226, 0.3);
      display: none; /* Hidden until game starts */
    }
    button.replay-btn:hover {
      background: #357abd;
    }
    .score-board {
      font-size: 1.2rem;
      font-weight: bold;
      color: #2c3e50;
      margin-top: 10px;
    }
    .grid {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      justify-content: center;
      max-width: 1000px;
      margin: 20px auto;
    }
    .card {
      background: white;
      padding: 20px 15px;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
      cursor: pointer;
      font-size: 1.1rem;
      font-weight: 500;
      width: 180px;
      min-height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      border: 2px solid transparent;
      user-select: none;
    }
    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 12px rgba(0,0,0,0.1);
      border-color: #4a90e2;
    }
    .card.correct {
      background: #2ed573 !important;
      color: white;
      border-color: #2ed573;
      animation: pulse 0.4s;
    }
    .card.wrong {
      background: #ff4757 !important;
      color: white;
      border-color: #ff4757;
    }
    .card.disabled {
      pointer-events: none;
      opacity: 0.3;
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>

  <h1>👂 Listen & Point</h1>
  
  <div class="controls">
    <div>
      <label for="unitSelect"><strong>Unit :</strong></label>
      <select id="unitSelect" onchange="loadSelectedUnit()" class="py-1 px-2.5 bg-indigo-50 border border-indigo-200 text-indigo-800 text-xs font-semibold rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 cursor-pointer">
        <optgroup label="EiM 9">
          <option value="data/eim9_u1.json">EiM 9 - Unit 1</option>
          <option value="data/eim9_u2.json">EiM 9 - Unit 2</option>
          <option value="data/eim9_u3.json">EiM 9 - Unit 3</option>
          <option value="data/eim9_u4.json">EiM 9 - Unit 4</option>
          <option value="data/eim9_u5.json">EiM 9 - Unit 5</option>
          <option value="data/eim9_u6.json">EiM 9 - Unit 6</option>
          <option value="data/eim9_u7.json">EiM 9 - Unit 7</option>
          <option value="data/eim9_u8.json">EiM 9 - Unit 8</option>
        </optgroup>
        <optgroup label="EiM 10">
          <option value="data/eim10_u1.json">EiM 10 - Unit 1</option>
          <option value="data/eim10_u2.json">EiM 10 - Unit 2</option>
          <option value="data/eim10_u3.json">EiM 10 - Unit 3</option>
          <option value="data/eim10_u4.json">EiM 10 - Unit 4</option>
          <option value="data/eim10_u5.json">EiM 10 - Unit 5</option>
          <option value="data/eim10_u6.json">EiM 10 - Unit 6</option>
          <option value="data/eim10_u7.json">EiM 10 - Unit 7</option>
          <option value="data/eim10_u8.json">EiM 10 - Unit 8</option>
        </optgroup>
        <optgroup label="EiM 11">
          <option value="data/eim11_u1.json">EiM 11 - Unit 1</option>
          <option value="data/eim11_u2.json">EiM 11 - Unit 2</option>
          <option value="data/eim11_u3.json">EiM 11 - Unit 3</option>
          <option value="data/eim11_u4.json" selected>EiM 11 - Unit 4</option>
          <option value="data/eim11_u5.json">EiM 11 - Unit 5</option>
          <option value="data/eim11_u6.json">EiM 11 - Unit 6</option>
        </optgroup>
      </select>
    </div>

    <div>
      <label for="mode-select"><strong>Level :</strong></label>
      <select id="mode-select" onchange="resetGame()">
        <option value="easy">Easy (Sound ➔ English)</option>
        <option value="medium">Medium (Sound ➔ French)</option>
      </select>
    </div>

    <div>
      <label for="grid-size"><strong>Cards :</strong></label>
      <select id="grid-size" onchange="resetGame()">
        <option value="6">6 cards</option>
        <option value="9">9 cards</option>
        <option value="12">12 cards</option>
        <option value="15">15 cards</option>
      </select>
    </div>
    
    <button class="action-btn" onclick="resetGame()">🔄 Reset</button>
  </div>

  <div class="audio-section">
    <button id="start-game-btn" class="start-btn" onclick="startGame()">▶️ Start Game</button>
    <button id="replay-btn" class="replay-btn" onclick="playSecretWord()">🔊 Listen again</button>
    <div class="score-board">Score : <span id="score">0</span> / <span id="total">0</span></div>
  </div>

  <div id="word-grid" class="grid"></div>

  <script>
    let currentVocabulary = [];
    let activeWords = [];
    let currentTargetWord = null;
    let score = 0;
    let totalAttempts = 0;
    let gameStarted = false;

    // Load JSON data dynamically based on selected unit
    async function loadSelectedUnit() {
      const fileUrl = document.getElementById('unitSelect').value;
      try {
        const response = await fetch(fileUrl);
        if (!response.ok) throw new Error("File not found");
        const data = await response.json();
        currentVocabulary = data.words;
        resetGame();
      } catch (error) {
        console.warn("Could not load " + fileUrl + ", using fallback dummy data.");
        // Fallback dummy data if file isn't uploaded yet
        currentVocabulary = [
          { "id": 1, "en": "the adult", "fr": "l'adulte" },
          { "id": 6, "en": "the teenager", "fr": "l'adolescent" },
          { "id": 7, "en": "the toddler", "fr": "le petit enfant" },
          { "id": 16, "en": "annoyed", "fr": "énervé, agacé" },
          { "id": 20, "en": "exhausted", "fr": "épuisé" },
          { "id": 26, "en": "the satellite dish", "fr": "l'antenne parabolique" },
          { "id": 30, "en": "crispy", "fr": "croustillant" },
          { "id": 39, "en": "the fan", "fr": "le fan" }
        ];
        resetGame();
      }
    }

    // Sound effects using Web Audio API
    function playSound(type) {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const now = audioCtx.currentTime;
        
        if (type === 'win') {
          const playTone = (freq, startTime, duration) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, startTime);
            gain.gain.setValueAtTime(0.15, startTime);
            gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(startTime);
            osc.stop(startTime + duration);
          };
          playTone(523.25, now, 0.15);       // C5
          playTone(659.25, now + 0.12, 0.15); // E5
          playTone(783.99, now + 0.24, 0.3);  // G5
        } else if (type === 'fail') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(200, now);
          osc.frequency.linearRampToValueAtTime(120, now + 0.2);
          gain.gain.setValueAtTime(0.1, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.2);
        }
      } catch (e) {}
    }

    function startGame() {
      gameStarted = true;
      document.getElementById('start-game-btn').style.display = 'none';
      document.getElementById('replay-btn').style.display = 'inline-block';
      resetGame();
    }

    // Reset and initialize a new round
    function resetGame() {
      score = 0;
      totalAttempts = 0;
      updateScoreboard();
      currentTargetWord = null;

      const requestedSize = parseInt(document.getElementById('grid-size').value);
      const poolSize = Math.min(requestedSize, currentVocabulary.length);

      activeWords = [...currentVocabulary].sort(() => 0.5 - Math.random()).slice(0, poolSize);
      
      const grid = document.getElementById('word-grid');
      grid.innerHTML = '';
      
      const mode = document.getElementById('mode-select').value;
      const displayWords = [...activeWords].sort(() => 0.5 - Math.random());

      displayWords.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerText = mode === 'easy' ? item.en : item.fr;
        card.onclick = () => checkAnswer(item, card);
        grid.appendChild(card);
      });

      if (gameStarted) {
        pickAndPlayNewWord();
      }
    }

    function pickAndPlayNewWord() {
      if (activeWords.length === 0) {
        alert("🎉 Awesome job! You found all the words in this set!");
        return;
      }
      const randomIndex = Math.floor(Math.random() * activeWords.length);
      currentTargetWord = activeWords[randomIndex];
      playSecretWord();
    }

    function playSecretWord() {
      if (!currentTargetWord && activeWords.length > 0) {
        pickAndPlayNewWord();
        return;
      }
      if (!currentTargetWord) return;

      window.speechSynthesis.cancel(); 
      const utterance = new SpeechSynthesisUtterance(currentTargetWord.en);
      utterance.lang = 'en-GB';
      utterance.rate = 0.85;
      window.speechSynthesis.speak(utterance);
    }

    function checkAnswer(selectedItem, cardElement) {
      if (!gameStarted || !currentTargetWord || cardElement.classList.contains('disabled')) return;

      totalAttempts++;

      if (selectedItem.id === currentTargetWord.id) {
        cardElement.classList.add('correct', 'disabled');
        score++;
        updateScoreboard();
        playSound('win');
        
        activeWords = activeWords.filter(w => w.id !== currentTargetWord.id);
        
        // Automatically play next word after win sound delay
        setTimeout(() => {
          pickAndPlayNewWord();
        }, 700);
      } else {
        cardElement.classList.add('wrong');
        updateScoreboard();
        playSound('fail');
        
        setTimeout(() => {
          cardElement.classList.remove('wrong');
          // Replay current target word automatically after a mistake so they can try again
          playSecretWord();
        }, 600);
      }
    }

    function updateScoreboard() {
      document.getElementById('score').innerText = score;
      document.getElementById('total').innerText = totalAttempts;
    }

    // Initial load on page startup
    window.onload = loadSelectedUnit;
  </script>
</body>
</html>
