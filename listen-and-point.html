<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Listen & Point - English Vocabulary</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-blue: #38bdf8;
      --accent-purple: #c084fc;
      --accent-green: #34d399;
      --accent-red: #f87171;
      --accent-amber: #f59e0b;
      --border-color: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }

    .container {
      width: 100%;
      max-width: 800px;
      margin: 0 auto;
    }

    /* Floating Navigation Button */
    .top-left-nav {
      position: absolute;
      top: 1.5rem;
      left: 1.5rem;
    }

    a.home-btn {
      padding: 0.6rem 1.2rem;
      font-size: 0.9rem;
      border-radius: 9999px;
      border: 1px solid var(--border-color);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-main);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-weight: 500;
      backdrop-filter: blur(8px);
      transition: all 0.2s ease;
    }

    a.home-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: var(--accent-blue);
      transform: translateY(-1px);
    }

    /* Header styling styled like index.html */
    header {
      text-align: center;
      margin-top: 2rem;
      margin-bottom: 2rem;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 800;
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 1.1rem;
    }

    /* Controls block matching index.html card style */
    .controls {
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid var(--border-color);
      backdrop-filter: blur(12px);
      padding: 1.25rem 1.5rem;
      border-radius: 1rem;
      margin-bottom: 1.5rem;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
      display: flex;
      gap: 1.25rem;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .control-group label {
      color: var(--text-muted);
      font-size: 0.9rem;
      font-weight: 600;
    }

    select, button.action-btn {
      padding: 0.5rem 0.85rem;
      font-size: 0.9rem;
      border-radius: 0.5rem;
      border: 1px solid var(--border-color);
      background: var(--bg-color);
      color: var(--text-main);
      cursor: pointer;
      font-weight: 500;
      outline: none;
      transition: all 0.2s ease;
    }

    select:focus, select:hover, button.action-btn:hover {
      border-color: var(--accent-blue);
    }

    button.action-btn {
      background: rgba(255, 255, 255, 0.05);
    }

    button.action-btn:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    /* Star Mode Indicator Badge */
    .starred-badge {
      display: none;
      align-items: center;
      gap: 0.4rem;
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid rgba(245, 158, 11, 0.4);
      color: var(--accent-amber);
      padding: 0.35rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 600;
    }

    /* Game controls / Audio section */
    .audio-section {
      text-align: center;
      margin: 1.5rem 0;
    }

    button.start-btn {
      font-size: 1.1rem;
      font-weight: 600;
      padding: 0.8rem 2rem;
      border-radius: 9999px;
      border: none;
      background: linear-gradient(135deg, #10b981, #059669);
      color: white;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.35);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    button.start-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(16, 185, 129, 0.45);
    }

    button.replay-btn {
      font-size: 1rem;
      font-weight: 600;
      padding: 0.75rem 1.5rem;
      border-radius: 9999px;
      border: none;
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      color: white;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(59, 130, 246, 0.35);
      display: none; 
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    button.replay-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(59, 130, 246, 0.45);
    }

    .score-board {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-top: 1rem;
    }

    .score-board span {
      color: var(--accent-blue);
    }

    /* Cards Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(160px, 1fr));
      gap: 1rem;
      justify-content: center;
      max-width: 650px;
      margin: 1.5rem auto;
    }

    .card {
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 1.25rem 1rem;
      border-radius: 0.85rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
      cursor: pointer;
      font-size: 1.05rem;
      font-weight: 500;
      min-height: 70px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      transition: all 0.2s ease;
      user-select: none;
      backdrop-filter: blur(8px);
    }

    .card:hover {
      transform: translateY(-3px);
      border-color: var(--accent-blue);
      box-shadow: 0 8px 15px -3px rgba(56, 189, 248, 0.15);
    }

    .card.correct {
      background: rgba(52, 211, 153, 0.2) !important;
      border-color: var(--accent-green) !important;
      color: #6ee7b7;
      animation: pulse 0.4s;
    }

    .card.wrong {
      background: rgba(248, 113, 113, 0.2) !important;
      border-color: var(--accent-red) !important;
      color: #fca5a5;
    }

    .card.disabled {
      pointer-events: none;
      opacity: 0.35;
    }

    /* Festive Gold / Victory Banner */
    #victory-banner {
      display: none;
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.15), rgba(217, 119, 6, 0.25));
      border: 2px solid #f59e0b;
      border-radius: 1.25rem;
      max-width: 500px;
      margin: 2rem auto;
      padding: 2rem;
      box-shadow: 0 10px 30px rgba(245, 158, 11, 0.2);
      backdrop-filter: blur(12px);
      animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      text-align: center;
    }

    #victory-banner h2 {
      color: #fbbf24;
      font-size: 2rem;
      margin-bottom: 0.5rem;
    }

    #victory-banner p {
      font-size: 1.1rem;
      color: var(--text-main);
      margin-bottom: 1.5rem;
    }

    @keyframes popIn {
      0% { transform: scale(0.8); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }

    @media (max-width: 640px) {
      .grid {
        grid-template-columns: repeat(2, 1fr);
      }
      .top-left-nav {
        position: static;
        margin-bottom: 1rem;
        display: flex;
        justify-content: flex-start;
      }
    }
  </style>
</head>
<body>

  <!-- Top-left Navigation Button -->
  <div class="top-left-nav">
    <a href="index.html" class="home-btn">← Back to Lists</a>
  </div>

  <div class="container">
    <header>
      <h1>🎮 Listen & Point</h1>
      <p class="subtitle">Listen carefully to the audio and click on the matching word</p>
    </header>

    <div class="controls">
      <div id="starredBadge" class="starred-badge">
        <span>⭐</span> Starred Words Only
      </div>

      <div class="control-group">
        <label for="mode-select">Level :</label>
        <select id="mode-select" onchange="resetGame()">
          <option value="easy">Easy (Sound ➔ English)</option>
          <option value="medium" selected>Medium (Sound ➔ French)</option>
        </select>
      </div>

      <div class="control-group">
        <label for="grid-size">Cards :</label>
        <select id="grid-size" onchange="resetGame()">
          <option value="6">6 cards</option>
          <option value="9" selected>9 cards</option>
          <option value="12">12 cards</option>
          <option value="15">15 cards</option>
        </select>
      </div>

      <button class="action-btn" onclick="resetGame()">🔄 New Cards</button>
    </div>

    <div class="audio-section">
      <button id="start-game-btn" class="start-btn" onclick="startGame()">▶️ Start Game</button>
      <button id="replay-btn" class="replay-btn" onclick="playSecretWord()">🔊 Listen again</button>
      <div class="score-board">Score : <span id="score">0</span> / <span id="total">0</span></div>
    </div>

    <!-- Victory Banner Popup -->
    <div id="victory-banner">
      <h2>🏆 AMAZING JOB! 🌟</h2>
      <p>You matched all the words successfully!</p>
      <button class="start-btn" onclick="startGame()">Play Again 🚀</button>
    </div>

    <div id="word-grid" class="grid"></div>
  </div>

  <script>
    const STARRED_STORAGE_KEY = 'vocab_app_starred_v1';

    let currentVocabulary = [];
    let activeWords = [];
    let currentTargetWord = null;
    let score = 0;
    let totalAttempts = 0;
    let gameStarted = false;

    function getStoredStarred() {
      try {
        const saved = localStorage.getItem(STARRED_STORAGE_KEY);
        return saved ? JSON.parse(saved) : {};
      } catch (e) {
        return {};
      }
    }

    // Load unit automatically based on URL parameters ?unit=... & ?starred=true
    async function loadUnitFromUrl() {
      const urlParams = new URLSearchParams(window.location.search);
      let unitParam = urlParams.get('unit') || 'eim9_u1.json';
      const isStarredOnly = urlParams.get('starred') === 'true';

      // Clean unit name and form data path
      const cleanUnitName = unitParam.replace(/^data\//, '');
      const unitKey = cleanUnitName.replace('.json', '');
      const fileUrl = `data/${cleanUnitName}`;

      if (isStarredOnly) {
        const badge = document.getElementById('starredBadge');
        if (badge) badge.style.display = 'inline-flex';
      }

      try {
        const response = await fetch(fileUrl);
        if (!response.ok) throw new Error("File not found");
        const data = await response.json();

        const starredMap = getStoredStarred();

        // Map items with composite IDs matching index.html format
        let loadedWords = (data.words || []).map(item => {
          const rawId = item.id;
          const fullId = `${unitKey}_${rawId}`;
          return {
            id: fullId,
            originalId: rawId,
            en: item.en || item.english || '',
            fr: item.fr || item.french || '',
            spoken: item.spoken || item.en || item.english || ''
          };
        });

        // Filter starred words if requested
        if (isStarredOnly) {
          const starredWords = loadedWords.filter(w => !!starredMap[w.id]);
          if (starredWords.length > 0) {
            loadedWords = starredWords;
          } else {
            alert("No starred words found in this unit! Loading all unit words instead.");
            document.getElementById('starredBadge').style.display = 'none';
          }
        }

        currentVocabulary = loadedWords;
        resetGame();
      } catch (error) {
        console.warn("Could not load " + fileUrl + ", using fallback dummy data.");
        currentVocabulary = [
          { "id": "fallback_1", "en": "the adult", "fr": "l'adulte", "spoken": "the adult" },
          { "id": "fallback_6", "en": "the teenager", "fr": "l'adolescent", "spoken": "the teenager" },
          { "id": "fallback_7", "en": "the toddler", "fr": "le petit enfant", "spoken": "the toddler" },
          { "id": "fallback_16", "en": "annoyed", "fr": "énervé, agacé", "spoken": "annoyed" },
          { "id": "fallback_20", "en": "exhausted", "fr": "épuisé", "spoken": "exhausted" },
          { "id": "fallback_26", "en": "the satellite dish", "fr": "l'antenne parabolique", "spoken": "the satellite dish" },
          { "id": "fallback_30", "en": "crispy", "fr": "croustillant", "spoken": "crispy" },
          { "id": "fallback_39", "en": "the fan", "fr": "le fan", "spoken": "the fan" }
        ];
        resetGame();
      }
    }

    function playSound(type) {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const now = audioCtx.currentTime;

        if (type === 'win') {
          const playTone = (freq, startTime, duration) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, startTime);
            gain.gain.setValueAtTime(0.15, startTime);
            gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(startTime);
            osc.stop(startTime + duration);
          };
          playTone(523.25, now, 0.15);
          playTone(659.25, now + 0.12, 0.15);
          playTone(783.99, now + 0.24, 0.3);
        } else if (type === 'fail') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(200, now);
          osc.frequency.linearRampToValueAtTime(120, now + 0.2);
          gain.gain.setValueAtTime(0.1, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.2);
        }
      } catch (e) {}
    }

    function startGame() {
      gameStarted = true;
      document.getElementById('start-game-btn').style.display = 'none';
      document.getElementById('replay-btn').style.display = 'inline-block';
      document.getElementById('victory-banner').style.display = 'none';
      document.getElementById('word-grid').style.display = 'grid';
      resetGame();
    }

    function resetGame() {
      score = 0;
      totalAttempts = 0;
      updateScoreboard();
      currentTargetWord = null;
      document.getElementById('victory-banner').style.display = 'none';
      document.getElementById('word-grid').style.display = 'grid';

      const requestedSize = parseInt(document.getElementById('grid-size').value);
      const poolSize = Math.min(requestedSize, currentVocabulary.length);

      activeWords = [...currentVocabulary].sort(() => 0.5 - Math.random()).slice(0, poolSize);

      const grid = document.getElementById('word-grid');
      grid.innerHTML = '';

      const mode = document.getElementById('mode-select').value;
      const displayWords = [...activeWords].sort(() => 0.5 - Math.random());

      displayWords.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerText = mode === 'easy' ? item.en : item.fr;
        card.onclick = () => checkAnswer(item, card);
        grid.appendChild(card);
      });

      if (gameStarted) {
        pickAndPlayNewWord();
      }
    }

    function pickAndPlayNewWord() {
      if (activeWords.length === 0) {
        document.getElementById('word-grid').style.display = 'none';
        document.getElementById('victory-banner').style.display = 'block';
        playSound('win');
        return;
      }
      const randomIndex = Math.floor(Math.random() * activeWords.length);
      currentTargetWord = activeWords[randomIndex];
      playSecretWord();
    }

    function playSecretWord() {
      if (!currentTargetWord && activeWords.length > 0) {
        pickAndPlayNewWord();
        return;
      }
      if (!currentTargetWord) return;

      window.speechSynthesis.cancel();
      const textToSpeak = currentTargetWord.spoken || currentTargetWord.en;
      const utterance = new SpeechSynthesisUtterance(textToSpeak);
      utterance.lang = 'en-GB';
      utterance.rate = 0.85;
      window.speechSynthesis.speak(utterance);
    }

    function checkAnswer(selectedItem, cardElement) {
      if (!gameStarted || !currentTargetWord || cardElement.classList.contains('disabled')) return;

      totalAttempts++;

      if (selectedItem.id === currentTargetWord.id) {
        cardElement.classList.add('correct', 'disabled');
        score++;
        updateScoreboard();
        playSound('win');

        activeWords = activeWords.filter(w => w.id !== currentTargetWord.id);

        setTimeout(() => {
          pickAndPlayNewWord();
        }, 700);
      } else {
        cardElement.classList.add('wrong');
        updateScoreboard();
        playSound('fail');

        setTimeout(() => {
          cardElement.classList.remove('wrong');
          playSecretWord();
        }, 600);
      }
    }

    function updateScoreboard() {
      document.getElementById('score').innerText = score;
      document.getElementById('total').innerText = totalAttempts;
    }

    window.onload = function() {
      loadUnitFromUrl();
    };
  </script>
</body>
</html>
