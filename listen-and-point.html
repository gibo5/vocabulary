<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Listen and Point - EiM Game</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Inter Font -->
  <link rel="stylesheet" href="https://rsms.me/inter/inter.css">
  <style>
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col selection:bg-indigo-500 selection:text-white">

  <!-- Header -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-xs">
    <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <a href="index.html" class="p-2 rounded-lg border border-slate-200 hover:bg-slate-50 transition text-slate-600" title="Back to Vocabulary">
          ➔ Back
        </a>
        <div>
          <h1 id="gameUnitTitle" class="text-base sm:text-lg font-bold text-slate-900 leading-tight">Listen & Point</h1>
          <p class="text-xs text-slate-500">Listen to the audio and click the right word!</p>
        </div>
      </div>

      <!-- Live Score -->
      <div class="flex items-center gap-3">
        <div class="bg-indigo-50 border border-indigo-100 px-3 py-1 rounded-xl text-xs font-semibold text-indigo-700">
          Score: <span id="scoreVal" class="text-sm font-bold">0</span> / <span id="totalQuestions">0</span>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Game Container -->
  <main class="max-w-4xl mx-auto px-4 py-6 flex-grow w-full flex flex-col items-center justify-center">

    <!-- Loading State -->
    <div id="gameLoading" class="text-center py-12 bg-white rounded-2xl border border-slate-200 w-full text-slate-500 font-medium">
      Loading game data...
    </div>

    <!-- Error State -->
    <div id="gameError" class="hidden text-center py-12 bg-white rounded-2xl border border-rose-200 w-full text-rose-600 font-medium space-y-3">
      <p id="errorMessage">Unable to load words for this unit.</p>
      <a href="index.html" class="inline-block px-4 py-2 bg-slate-800 text-white rounded-xl text-xs font-semibold hover:bg-slate-900 transition">Return to Home</a>
    </div>

    <!-- Active Game Box -->
    <div id="gameBox" class="hidden w-full space-y-6">

      <!-- Audio Trigger Card -->
      <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm text-center flex flex-col items-center justify-center space-y-3">
        <button id="repeatAudioBtn" onclick="playTargetAudio()" class="w-16 h-16 rounded-full bg-indigo-600 hover:bg-indigo-700 text-white text-2xl flex items-center justify-center shadow-md hover:scale-105 active:scale-95 transition-all">
          🔊
        </button>
        <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Click to re-listen</p>
      </div>

      <!-- Word Choice Options Grid -->
      <div id="optionsGrid" class="grid grid-cols-2 sm:grid-cols-2 gap-3 sm:gap-4">
        <!-- Buttons injected dynamically -->
      </div>

    </div>

    <!-- Game Completed Screen -->
    <div id="gameComplete" class="hidden bg-white p-8 rounded-2xl border border-slate-200 shadow-sm text-center w-full max-w-md space-y-4">
      <span class="text-5xl block">🎉</span>
      <h2 class="text-xl font-bold text-slate-900">Unit Complete!</h2>
      <p class="text-sm text-slate-600">You scored <span id="finalScore" class="font-bold text-indigo-600">0</span> points!</p>
      
      <div class="flex gap-3 justify-center pt-2">
        <button onclick="restartGame()" class="px-4 py-2 bg-indigo-600 text-white font-semibold rounded-xl text-xs hover:bg-indigo-700 transition">
          🔄 Play Again
        </button>
        <a href="index.html" class="px-4 py-2 bg-slate-100 text-slate-700 font-semibold rounded-xl text-xs hover:bg-slate-200 transition">
          📋 Back to List
        </a>
      </div>
    </div>

  </main>

  <script>
    let words = [];
    let currentPool = [];
    let targetWord = null;
    let score = 0;
    let totalAsked = 0;
    let isAnswerLocked = false;

    // Helper: Extraire le paramètre "unit" de l'URL
    function getSelectedUnitFromURL() {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get('unit') || 'eim9_u1.json';
    }

    async function initGame() {
      const file = getSelectedUnitFromURL();

      const loadingEl = document.getElementById('gameLoading');
      const errorEl = document.getElementById('gameError');
      const gameBox = document.getElementById('gameBox');

      try {
        const response = await fetch(`data/${file}`);
        if (!response.ok) throw new Error(`Data file "data/${file}" not found.`);

        const json = await response.json();

        // Met à jour le titre
        document.getElementById('gameUnitTitle').textContent = json.title ? `Game • ${json.title}` : 'Listen & Point';

        words = (json.words || []).map(item => ({
          id: item.id,
          english: item.en || item.english || '',
          spoken: item.spoken || item.en || item.english || '',
          french: item.fr || item.french || ''
        }));

        if (words.length < 2) {
          throw new Error('Not enough words in this unit to play.');
        }

        loadingEl.classList.add('hidden');
        gameBox.classList.remove('hidden');

        restartGame();

      } catch (err) {
        loadingEl.classList.add('hidden');
        errorEl.classList.remove('hidden');
        document.getElementById('errorMessage').textContent = err.message;
      }
    }

    function restartGame() {
      score = 0;
      totalAsked = 0;
      currentPool = [...words];

      document.getElementById('scoreVal').textContent = '0';
      document.getElementById('totalQuestions').textContent = words.length;

      document.getElementById('gameComplete').classList.add('hidden');
      document.getElementById('gameBox').classList.remove('hidden');

      nextRound();
    }

    function nextRound() {
      if (currentPool.length === 0) {
        showCompletionScreen();
        return;
      }

      isAnswerLocked = false;

      // Choisit le mot cible parmi ceux restants
      const randomIndex = Math.floor(Math.random() * currentPool.length);
      targetWord = currentPool[randomIndex];

      // Génère 3 leurres
      const distractors = words.filter(w => w.id !== targetWord.id);
      shuffleArray(distractors);
      const selectedOptions = [targetWord, ...distractors.slice(0, 3)];
      shuffleArray(selectedOptions);

      // Génère l'affichage des choix
      const grid = document.getElementById('optionsGrid');
      grid.innerHTML = '';

      selectedOptions.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = "p-4 sm:p-5 bg-white border-2 border-slate-200 hover:border-indigo-400 rounded-2xl text-slate-800 font-bold text-sm sm:text-base shadow-xs hover:shadow transition-all text-center flex flex-col items-center justify-center min-h-[80px]";
        btn.textContent = opt.french;
        btn.onclick = () => handleChoice(opt, btn);
        grid.appendChild(btn);
      });

      // Prononce le mot cible
      setTimeout(() => {
        playTargetAudio();
      }, 300);
    }

    function playTargetAudio() {
      if (!targetWord || !('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();

      const textToSpeak = targetWord.spoken || targetWord.english;
      const utterance = new SpeechSynthesisUtterance(textToSpeak);
      utterance.lang = 'en-GB';
      utterance.rate = 0.85;

      window.speechSynthesis.speak(utterance);
    }

    function handleChoice(selectedOption, buttonEl) {
      if (isAnswerLocked) return;
      isAnswerLocked = true;

      totalAsked++;

      if (selectedOption.id === targetWord.id) {
        score++;
        document.getElementById('scoreVal').textContent = score;

        buttonEl.classList.remove('border-slate-200', 'hover:border-indigo-400');
        buttonEl.classList.add('bg-emerald-500', 'border-emerald-600', 'text-white');

        // Retire le mot réussi de la pile de révision
        currentPool = currentPool.filter(w => w.id !== targetWord.id);

        setTimeout(() => {
          nextRound();
        }, 1000);

      } else {
        buttonEl.classList.remove('border-slate-200', 'hover:border-indigo-400');
        buttonEl.classList.add('bg-rose-500', 'border-rose-600', 'text-white');

        // Révèle la bonne réponse
        const buttons = document.getElementById('optionsGrid').children;
        Array.from(buttons).forEach(btn => {
          if (btn.textContent === targetWord.french) {
            btn.classList.add('bg-emerald-100', 'border-emerald-400', 'text-emerald-800');
          }
        });

        setTimeout(() => {
          nextRound();
        }, 1800);
      }
    }

    function showCompletionScreen() {
      document.getElementById('gameBox').classList.add('hidden');
      document.getElementById('gameComplete').classList.remove('hidden');
      document.getElementById('finalScore').textContent = `${score} / ${totalAsked}`;
    }

    function shuffleArray(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
    }

    window.onload = initGame;
  </script>
</body>
</html>
