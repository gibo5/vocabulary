<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study Cards - English Vocabulary</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-blue: #38bdf8;
      --accent-purple: #c084fc;
      --accent-green: #34d399;
      --accent-amber: #f59e0b;
      --accent-red: #f87171;
      --border-color: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem 3rem;
      overflow-x: hidden;
    }

    .container { width: 100%; max-width: 760px; margin: 0 auto; }

    .top-left-nav { position: absolute; top: 1.5rem; left: 1.5rem; }

    a.home-btn {
      padding: 0.6rem 1.2rem;
      font-size: 0.9rem;
      border-radius: 9999px;
      border: 1px solid var(--border-color);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-main);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-weight: 500;
      backdrop-filter: blur(8px);
      transition: all 0.2s ease;
    }
    a.home-btn:hover { background: rgba(255, 255, 255, 0.1); border-color: var(--accent-blue); transform: translateY(-1px); }

    header { text-align: center; margin-top: 2rem; margin-bottom: 1.5rem; }

    h1 {
      font-size: 2.2rem;
      font-weight: 800;
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.4rem;
    }

    p.subtitle { color: var(--text-muted); font-size: 1rem; }

    /* ---------- Controls ---------- */
    .controls {
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid var(--border-color);
      backdrop-filter: blur(12px);
      padding: 1rem 1.25rem;
      border-radius: 1rem;
      margin-bottom: 1.25rem;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
      display: flex;
      gap: 1rem 1.5rem;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
    }

    .control-group { display: flex; align-items: center; gap: 0.6rem; }
    .control-group > label.group-label,
    .control-group > span.group-label {
      color: var(--text-muted);
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .toggle-group {
      display: inline-flex;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      padding: 3px;
    }
    .toggle-group button {
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 0.85rem;
      font-weight: 600;
      padding: 0.4rem 0.9rem;
      border-radius: 9999px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .toggle-group button.active { background: var(--accent-blue); color: #04263a; }

    .starred-badge {
      display: none;
      align-items: center;
      gap: 0.4rem;
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid rgba(245, 158, 11, 0.4);
      color: var(--accent-amber);
      padding: 0.35rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .filter-checks { display: flex; gap: 0.9rem; flex-wrap: wrap; }
    .filter-check {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      user-select: none;
    }
    .filter-check input { accent-color: var(--accent-blue); width: 15px; height: 15px; cursor: pointer; }

    /* ---------- Progress bar (dark variant of the index.html widget) ---------- */
    .progress-card {
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid var(--border-color);
      border-radius: 1rem;
      padding: 0.75rem 1.1rem;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.9rem;
    }
    .progress-card .prog-label {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      flex-shrink: 0;
    }
    .progress-track-wrap { position: relative; flex: 1; }
    .progress-track {
      display: flex;
      height: 8px;
      border-radius: 9999px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.08);
    }
    .progress-track > div { height: 100%; cursor: default; }
    #studyProgTooltip {
      display: none;
      position: absolute;
      bottom: 100%;
      margin-bottom: 6px;
      transform: translateX(-50%);
      white-space: nowrap;
      background: #f8fafc;
      color: #0f172a;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 6px;
      pointer-events: none;
      z-index: 20;
    }
    .progress-card .prog-fraction { font-size: 0.8rem; font-weight: 700; color: var(--accent-green); flex-shrink: 0; }

    /* ---------- Card stage ---------- */
    .stage {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      margin: 0.5rem 0 1.75rem;
    }

    .nav-arrow {
      flex-shrink: 0;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid var(--border-color);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-main);
      font-size: 1.3rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
    }
    .nav-arrow:hover:not(:disabled) { background: rgba(255, 255, 255, 0.12); border-color: var(--accent-blue); transform: scale(1.05); }
    .nav-arrow:disabled { opacity: 0.25; cursor: default; }

    .card-zone {
      position: relative;
      width: 100%;
      max-width: 420px;
    }

    /* Decorative "deck" cards peeking out behind the active card */
    .stack-card {
      position: absolute;
      inset: 0;
      border-radius: 1.25rem;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
    }
    .stack-card.stack-2 { transform: translateY(16px) scale(0.92); opacity: 0.35; z-index: 0; }
    .stack-card.stack-1 { transform: translateY(8px) scale(0.96); opacity: 0.6; z-index: 1; }

    .perspective { position: relative; z-index: 2; perspective: 1200px; }

    #cardInner {
      position: relative;
      width: 100%;
      height: 260px;
      cursor: pointer;
      transform-style: preserve-3d;
      transition: transform 0.5s cubic-bezier(0.4, 0.2, 0.2, 1);
    }
    #cardInner.flipped { transform: rotateY(180deg); }

    /* "Deck" transition: the current card recedes to the back, then the next
       one pops in from a slightly-shrunk state. Higher specificity than the
       base rule above, so it fully takes over the transform/transition during
       the swap, then normal flip behaviour resumes afterwards. */
    #cardInner.exiting {
      transition: transform 0.22s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.22s ease;
      transform: translateY(18px) scale(0.82);
      opacity: 0;
    }
    #cardInner.exiting.flipped { transform: translateY(18px) scale(0.82) rotateY(180deg); }
    #cardInner.entering {
      transition: none;
      transform: translateY(-14px) scale(0.9);
      opacity: 0;
    }

    .face {
      position: absolute;
      inset: 0;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      border-radius: 1.25rem;
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      text-align: center;
      background: #1e293b; /* fully opaque — a translucent bg let the back face's text bleed through mid-flip */
      box-shadow: 0 15px 35px -10px rgba(0, 0, 0, 0.45);
    }
    .face.back { transform: rotateY(180deg); }

    .face .lang-badge {
      position: absolute;
      top: 0.9rem;
      right: 1rem;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .face .word { font-size: 1.6rem; font-weight: 700; line-height: 1.25; }
    .face .ipa { font-size: 0.9rem; font-family: 'Courier New', monospace; color: var(--accent-blue); margin-top: 0.4rem; }

    /* Icon-only listen button, sits on top of the card (outside the flipping
       element) so it never rotates away and always controls whichever face
       is currently visible. */
    .listen-icon-btn {
      position: absolute;
      z-index: 5;
      bottom: 14px;
      right: 14px;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid var(--border-color);
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-main);
      font-size: 1.05rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
    }
    .listen-icon-btn:hover { background: rgba(56, 189, 248, 0.25); border-color: var(--accent-blue); }

    /* Rating pills ("le curseur trois points") sit directly on the card,
       also outside the flipping element, so they stay put and legible on
       either face and are unmistakably about *this* card. */
    .rating-row {
      position: absolute;
      z-index: 5;
      left: 50%;
      bottom: 14px;
      transform: translateX(-50%);
      display: flex;
      gap: 0.6rem;
    }
    .rating-pill {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 2px solid var(--border-color);
      font-size: 1.15rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      background: rgba(15, 23, 42, 0.55);
      transition: all 0.15s ease;
    }
    .rating-pill:hover { transform: translateY(-2px); }
    .rating-pill.easy.active { background: rgba(52, 211, 153, 0.3); border-color: var(--accent-green); }
    .rating-pill.medium.active { background: rgba(245, 158, 11, 0.3); border-color: var(--accent-amber); }
    .rating-pill.hard.active { background: rgba(248, 113, 113, 0.3); border-color: var(--accent-red); }

    .card-counter { text-align: center; color: var(--text-muted); font-size: 0.85rem; margin-top: 1rem; font-weight: 600; }

    .shortcuts-hint {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.75rem;
      margin-top: 1.75rem;
      opacity: 0.75;
    }
    .shortcuts-hint kbd {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-color);
      border-radius: 5px;
      padding: 1px 6px;
      font-family: inherit;
      font-size: 0.75rem;
    }

    .empty-state {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--text-muted);
      background: rgba(30, 41, 59, 0.5);
      border: 1px dashed var(--border-color);
      border-radius: 1rem;
    }

    @media (max-width: 640px) {
      .top-left-nav { position: static; margin-bottom: 1rem; display: flex; }
      .stage { gap: 0.4rem; }
      .nav-arrow { width: 38px; height: 38px; font-size: 1.1rem; }
    }
  </style>
</head>
<body>

  <div class="top-left-nav">
    <a id="back-btn" href="index.html" class="home-btn">← Back to Lists</a>
  </div>

  <div class="container">
    <header>
      <h1>📇 Study Cards</h1>
      <p class="subtitle">Flip, listen, and rate one card at a time</p>
    </header>

    <div class="controls">
      <div id="starredBadge" class="starred-badge"><span>⭐</span> Starred Words Only</div>

      <div class="control-group">
        <span class="group-label">Front</span>
        <div class="toggle-group" id="frontToggle">
          <button id="frontEnBtn" onclick="setDefaultFront('en')">🇬🇧 English</button>
          <button id="frontFrBtn" onclick="setDefaultFront('fr')">🇫🇷 Français</button>
        </div>
      </div>

      <div class="control-group">
        <span class="group-label">Show</span>
        <div class="filter-checks">
          <label class="filter-check"><input type="checkbox" id="filterEasy" checked onchange="onFilterChange()">🟢 Easy</label>
          <label class="filter-check"><input type="checkbox" id="filterMedium" checked onchange="onFilterChange()">🟡 Medium</label>
          <label class="filter-check"><input type="checkbox" id="filterHard" checked onchange="onFilterChange()">🔴 Hard</label>
          <label class="filter-check"><input type="checkbox" id="filterUnrated" checked onchange="onFilterChange()">⚪ Unrated</label>
        </div>
      </div>
    </div>

    <!-- Progress bar: mirrors index.html's widget, restyled for the dark theme -->
    <div class="progress-card">
      <span class="prog-label">Progress</span>
      <div class="progress-track-wrap">
        <div class="progress-track">
          <div id="progEasy" style="width:0%;background:var(--accent-green);" data-tip=""></div>
          <div id="progMedium" style="width:0%;background:var(--accent-amber);" data-tip=""></div>
          <div id="progHard" style="width:0%;background:var(--accent-red);" data-tip=""></div>
          <div id="progUnrated" style="width:100%;background:rgba(255,255,255,0.12);" data-tip=""></div>
        </div>
        <div id="studyProgTooltip"></div>
      </div>
      <span id="progressFraction" class="prog-fraction">0/0</span>
    </div>

    <!-- Card stage -->
    <div id="stage" class="stage">
      <button id="prevBtn" class="nav-arrow" onclick="goToCard(currentIndex - 1)" title="Previous (←)">‹</button>

      <div class="card-zone">
        <div class="stack-card stack-2"></div>
        <div class="stack-card stack-1"></div>

        <div class="perspective">
          <div id="cardInner" onclick="flipCard()">
            <div class="face front">
              <span id="frontBadge" class="lang-badge">[En]</span>
              <div id="frontWord" class="word">…</div>
              <div id="frontIpa" class="ipa"></div>
            </div>
            <div class="face back">
              <span id="backBadge" class="lang-badge">[Fr]</span>
              <div id="backWord" class="word">…</div>
              <div id="backIpa" class="ipa"></div>
            </div>
          </div>
        </div>

        <button id="listenBtn" class="listen-icon-btn" onclick="event.stopPropagation(); playCurrentFace();" title="Listen">🔊</button>

        <div class="rating-row">
          <div id="pillEasy" class="rating-pill easy" onclick="event.stopPropagation(); rateCurrentCard(1);" title="Easy (1)">🟢</div>
          <div id="pillMedium" class="rating-pill medium" onclick="event.stopPropagation(); rateCurrentCard(2);" title="Medium (2)">🟡</div>
          <div id="pillHard" class="rating-pill hard" onclick="event.stopPropagation(); rateCurrentCard(3);" title="Hard (3)">🔴</div>
        </div>
      </div>

      <button id="nextBtn" class="nav-arrow" onclick="goToCard(currentIndex + 1)" title="Next (→)">›</button>
    </div>

    <div id="cardCounter" class="card-counter">Card 0 / 0</div>

    <div id="emptyState" class="empty-state" style="display:none;">
      No cards match the selected filters.
    </div>

    <p class="shortcuts-hint">
      <kbd>␣</kbd> Flip &nbsp; <kbd>←</kbd> <kbd>→</kbd> Navigate &nbsp; <kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd> Rate Easy/Medium/Hard
    </p>
  </div>

  <script>
    const RATINGS_STORAGE_KEY = 'vocab_app_ratings_v1';
    const STARRED_STORAGE_KEY = 'vocab_app_starred_v1';
    const CURRENT_UNIT_STORAGE_KEY = 'vocab_app_current_unit';
    const DEFAULT_MODE_STORAGE_KEY = 'vocab_app_default_mode';
    const ACCENT_STORAGE_KEY = 'vocab_app_accent';
    const SPEED_STORAGE_KEY = 'vocab_app_speed';

    let fullUnitVocabulary = [];  // every word in the loaded unit — used for the progress bar
    let deck = [];                // filtered subset currently being browsed
    let currentIndex = 0;
    let defaultFace = 'en';       // which language shows on the front by default
    let ratingsMap = {};
    let starredMap = {};
    let isStarredOnly = false;
    let unitKey = 'eim9_u1';
    let isFlipped = false;
    let busy = false; // true while a rating-confirmation delay or card-change animation is running

    // ---------- localStorage helpers ----------
    function getStored(key) {
      try {
        const saved = localStorage.getItem(key);
        return saved ? JSON.parse(saved) : {};
      } catch (e) {
        return {};
      }
    }
    function saveRating(cardId, rating) {
      ratingsMap[cardId] = rating;
      try { localStorage.setItem(RATINGS_STORAGE_KEY, JSON.stringify(ratingsMap)); } catch (e) {}
    }

    // ---------- Load unit (mirrors listen-and-point.html's loader) ----------
    async function loadUnitFromUrl() {
      const urlParams = new URLSearchParams(window.location.search);
      let unitParam = urlParams.get('unit') || localStorage.getItem(CURRENT_UNIT_STORAGE_KEY) || 'eim9_u1.json';
      isStarredOnly = urlParams.get('starred') === 'true';

      const cleanUnitName = unitParam.replace(/^data\//, '');
      unitKey = cleanUnitName.replace('.json', '');
      const fileUrl = `data/${cleanUnitName}`;

      const backBtn = document.getElementById('back-btn');
      if (backBtn) backBtn.href = `index.html?unit=${encodeURIComponent(cleanUnitName)}`;

      if (isStarredOnly) {
        document.getElementById('starredBadge').style.display = 'inline-flex';
      }

      ratingsMap = getStored(RATINGS_STORAGE_KEY);
      starredMap = getStored(STARRED_STORAGE_KEY);
      defaultFace = localStorage.getItem(DEFAULT_MODE_STORAGE_KEY) || 'en';
      applyFrontToggleUI();

      try {
        const response = await fetch(fileUrl);
        if (!response.ok) throw new Error('File not found');
        const data = await response.json();

        fullUnitVocabulary = (data.words || []).map(item => {
          const fullId = `${unitKey}_${item.id}`;
          return {
            id: fullId,
            originalId: item.id,
            en: item.en || item.english || '',
            fr: item.fr || item.french || '',
            ipa: item.ipa || '',
            spoken: item.spoken || item.en || item.english || '',
          };
        });
      } catch (error) {
        console.warn('Could not load ' + fileUrl + ', using fallback dummy data.');
        fullUnitVocabulary = [
          { id: 'fallback_1', en: 'the adult', fr: "l'adulte", ipa: '', spoken: 'the adult' },
          { id: 'fallback_6', en: 'the teenager', fr: "l'adolescent", ipa: '', spoken: 'the teenager' },
          { id: 'fallback_7', en: 'the toddler', fr: 'le petit enfant', ipa: '', spoken: 'the toddler' },
          { id: 'fallback_16', en: 'annoyed', fr: 'énervé, agacé', ipa: '', spoken: 'annoyed' },
          { id: 'fallback_20', en: 'exhausted', fr: 'épuisé', ipa: '', spoken: 'exhausted' },
        ];
      }

      buildDeck();
      updateProgressBar();
    }

    // ---------- Deck filtering ----------
    function buildDeck() {
      const wantEasy = document.getElementById('filterEasy').checked;
      const wantMedium = document.getElementById('filterMedium').checked;
      const wantHard = document.getElementById('filterHard').checked;
      const wantUnrated = document.getElementById('filterUnrated').checked;

      deck = fullUnitVocabulary.filter(item => {
        if (isStarredOnly && !starredMap[item.id]) return false;
        const rating = ratingsMap[item.id] || 0;
        if (rating === 1) return wantEasy;
        if (rating === 2) return wantMedium;
        if (rating === 3) return wantHard;
        return wantUnrated;
      });

      currentIndex = 0;
      renderCardImmediate();
    }

    function onFilterChange() {
      buildDeck();
    }

    // ---------- Front/back preference (shared with index.html) ----------
    function setDefaultFront(mode) {
      defaultFace = mode;
      localStorage.setItem(DEFAULT_MODE_STORAGE_KEY, mode);
      applyFrontToggleUI();
      renderCardImmediate();
    }
    function applyFrontToggleUI() {
      document.getElementById('frontEnBtn').classList.toggle('active', defaultFace === 'en');
      document.getElementById('frontFrBtn').classList.toggle('active', defaultFace === 'fr');
    }

    // ---------- Card rendering ----------
    function currentCard() {
      return deck[currentIndex] || null;
    }

    function getCardInner() { return document.getElementById('cardInner'); }

    function renderCardImmediate() {
      const stage = document.getElementById('stage');
      const emptyState = document.getElementById('emptyState');
      const item = currentCard();

      if (!item) {
        stage.style.display = 'none';
        emptyState.style.display = 'block';
        document.getElementById('cardCounter').textContent = 'Card 0 / 0';
        return;
      }
      stage.style.display = 'flex';
      emptyState.style.display = 'none';

      isFlipped = false;
      const cardInner = getCardInner();
      cardInner.classList.remove('flipped');

      const frontIsEnglish = defaultFace === 'en';
      const frontText = frontIsEnglish ? item.en : item.fr;
      const backText = frontIsEnglish ? item.fr : item.en;

      document.getElementById('frontWord').textContent = frontText;
      document.getElementById('backWord').textContent = backText;
      document.getElementById('frontBadge').textContent = frontIsEnglish ? '[En]' : '[Fr]';
      document.getElementById('backBadge').textContent = frontIsEnglish ? '[Fr]' : '[En]';
      document.getElementById('frontIpa').textContent = frontIsEnglish && item.ipa ? `/${item.ipa}/` : '';
      document.getElementById('backIpa').textContent = !frontIsEnglish && item.ipa ? `/${item.ipa}/` : '';

      document.getElementById('cardCounter').textContent = `Card ${currentIndex + 1} / ${deck.length}`;
      document.getElementById('prevBtn').disabled = currentIndex === 0;
      document.getElementById('nextBtn').disabled = currentIndex === deck.length - 1;

      updateRatingPills(item);

      // Auto-play English audio whenever the English face is the one showing.
      if (frontIsEnglish) {
        speakWord(item.spoken || item.en, 'en-GB');
      }
    }

    function updateRatingPills(item) {
      const rating = ratingsMap[item.id] || 0;
      document.getElementById('pillEasy').classList.toggle('active', rating === 1);
      document.getElementById('pillMedium').classList.toggle('active', rating === 2);
      document.getElementById('pillHard').classList.toggle('active', rating === 3);
    }

    // ---------- "Deck" transition: current card recedes to the back, next
    // card pops in from a slightly-shrunk state. Used by both plain
    // navigation and rating-triggered advances, so every card change scrolls
    // through the same motion. ----------
    const TRANSITION_OUT_MS = 220;
    const TRANSITION_IN_MS = 260;

    function animateToCard(newIndex, onDone) {
      const card = getCardInner();
      card.classList.add('exiting');
      setTimeout(() => {
        currentIndex = newIndex;
        renderCardImmediate();
        card.classList.remove('exiting');
        card.classList.add('entering');
        void card.offsetWidth; // force reflow so the "entering" start state is committed
        requestAnimationFrame(() => {
          card.classList.remove('entering');
          setTimeout(() => { if (onDone) onDone(); }, TRANSITION_IN_MS);
        });
      }, TRANSITION_OUT_MS);
    }

    // ---------- Navigation ----------
    function goToCard(index) {
      if (busy) return;
      if (index < 0 || index >= deck.length) return; // no wrap-around
      busy = true;
      animateToCard(index, () => { busy = false; });
    }

    // ---------- Flip ----------
    function flipCard() {
      if (busy || !currentCard()) return;
      isFlipped = !isFlipped;
      getCardInner().classList.toggle('flipped', isFlipped);

      const item = currentCard();
      const frontIsEnglish = defaultFace === 'en';
      const nowShowingEnglish = isFlipped ? !frontIsEnglish : frontIsEnglish;
      if (nowShowingEnglish) {
        speakWord(item.spoken || item.en, 'en-GB');
      }
    }

    // ---------- Audio ----------
    function speakWord(text, lang) {
      if (!('speechSynthesis' in window) || !text) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = lang;
      utterance.rate = parseFloat(localStorage.getItem(SPEED_STORAGE_KEY)) || 0.85;
      if (lang.startsWith('en')) {
        utterance.lang = localStorage.getItem(ACCENT_STORAGE_KEY) || 'en-GB';
      }
      window.speechSynthesis.speak(utterance);
    }

    // Plays whichever face is currently visible (front or back), used by the
    // single shared listen icon that sits on top of the card.
    function playCurrentFace() {
      const item = currentCard();
      if (!item) return;
      const frontIsEnglish = defaultFace === 'en';
      const showingEnglish = isFlipped ? !frontIsEnglish : frontIsEnglish;
      if (showingEnglish) {
        speakWord(item.spoken || item.en, 'en-GB');
      } else {
        speakWord(item.fr, 'fr-FR');
      }
    }

    // ---------- Rating (pills / keys all funnel through here) ----------
    function rateCurrentCard(rating) {
      if (busy) return;
      const item = currentCard();
      if (!item) return;

      busy = true; // lock immediately so a second click can't queue up during the feedback pause

      saveRating(item.id, rating);
      updateRatingPills(item); // visible right away — this was the actual bug being fixed
      updateProgressBar();

      const filterMap = { 1: 'filterEasy', 2: 'filterMedium', 3: 'filterHard' };
      const stillVisible = document.getElementById(filterMap[rating]).checked;

      // Give the student a moment to actually see the pill light up on the
      // current card before it slides away to the back of the deck.
      const RATING_FEEDBACK_DELAY = 450;

      setTimeout(() => {
        if (!stillVisible) {
          // The new rating excludes this card from the active filters —
          // rebuild the deck rather than just moving to the next index.
          buildDeck();
          busy = false;
        } else if (currentIndex < deck.length - 1) {
          animateToCard(currentIndex + 1, () => { busy = false; });
        } else {
          busy = false; // last card: nothing to advance to, stay put
        }
      }, RATING_FEEDBACK_DELAY);
    }

    // ---------- Progress bar (same logic/markup pattern as index.html) ----------
    function updateProgressBar() {
      const total = fullUnitVocabulary.length;
      if (total === 0) return;

      let easy = 0, medium = 0, hard = 0;
      fullUnitVocabulary.forEach(item => {
        const r = ratingsMap[item.id] || 0;
        if (r === 1) easy++;
        else if (r === 2) medium++;
        else if (r === 3) hard++;
      });
      const unrated = total - easy - medium - hard;
      const pct = n => (n / total * 100).toFixed(2) + '%';

      document.getElementById('progressFraction').textContent = `${easy}/${total}`;
      document.getElementById('progEasy').style.width = pct(easy);
      document.getElementById('progMedium').style.width = pct(medium);
      document.getElementById('progHard').style.width = pct(hard);
      document.getElementById('progUnrated').style.width = pct(unrated);

      document.getElementById('progEasy').dataset.tip = `${easy} easy`;
      document.getElementById('progMedium').dataset.tip = `${medium} medium`;
      document.getElementById('progHard').dataset.tip = `${hard} hard`;
      document.getElementById('progUnrated').dataset.tip = `${unrated} unrated`;
    }

    function bindProgressTooltips() {
      ['progEasy', 'progMedium', 'progHard', 'progUnrated'].forEach(id => {
        const el = document.getElementById(id);
        el.addEventListener('mouseenter', () => {
          const tip = document.getElementById('studyProgTooltip');
          if (!el.dataset.tip) return;
          tip.textContent = el.dataset.tip;
          tip.style.left = (el.offsetLeft + el.offsetWidth / 2) + 'px';
          tip.style.display = 'block';
        });
        el.addEventListener('mouseleave', () => {
          document.getElementById('studyProgTooltip').style.display = 'none';
        });
      });
    }

    // ---------- Keyboard shortcuts ----------
    document.addEventListener('keydown', (e) => {
      const tag = document.activeElement ? document.activeElement.tagName : '';
      if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA' || tag === 'BUTTON') return; // don't hijack form controls

      if (e.code === 'Space') { e.preventDefault(); flipCard(); }
      else if (e.code === 'ArrowLeft') { e.preventDefault(); goToCard(currentIndex - 1); }
      else if (e.code === 'ArrowRight') { e.preventDefault(); goToCard(currentIndex + 1); }
      else if (e.key === '1') { rateCurrentCard(1); }
      else if (e.key === '2') { rateCurrentCard(2); }
      else if (e.key === '3') { rateCurrentCard(3); }
    });

    bindProgressTooltips();
    loadUnitFromUrl();
  </script>
</body>
</html>
