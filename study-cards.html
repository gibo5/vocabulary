<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study Cards - English Vocabulary</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-blue: #38bdf8;
      --accent-purple: #c084fc;
      --accent-green: #34d399;
      --accent-amber: #f59e0b;
      --accent-red: #f87171;
      --border-color: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.5rem 0.5rem 3rem;
      overflow-x: hidden;
    }

    .container { width: 100%; max-width: 680px; margin: 0 auto; }

    .top-left-nav { position: absolute; top: 1.5rem; left: 1.5rem; }

    a.home-btn {
      padding: 0.6rem 1.2rem;
      font-size: 0.9rem;
      border-radius: 9999px;
      border: 1px solid var(--border-color);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-main);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-weight: 500;
      backdrop-filter: blur(8px);
      transition: all 0.2s ease;
    }
    a.home-btn:hover { background: rgba(255, 255, 255, 0.1); border-color: var(--accent-blue); transform: translateY(-1px); }

    header { text-align: center; margin-top: 2rem; margin-bottom: 1.25rem; }

    h1 {
      font-size: 2.2rem;
      font-weight: 800;
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.4rem;
    }

    p.subtitle { color: var(--text-muted); font-size: 0.95rem; }

    /* ---------- Controls & Merged Filter/Progress Bar ---------- */
    .controls {
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid var(--border-color);
      backdrop-filter: blur(12px);
      padding: 1rem;
      border-radius: 1rem;
      margin-bottom: 1.5rem;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      gap: 1rem;
      align-items: center;
    }

    .control-row {
      display: flex;
      gap: 1rem;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      width: 100%;
    }

    .control-group { display: flex; align-items: center; gap: 0.6rem; }
    .control-group > span.group-label {
      color: var(--text-muted);
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .toggle-group {
      display: inline-flex;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      padding: 3px;
    }
    .toggle-group button {
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 0.85rem;
      font-weight: 600;
      padding: 0.4rem 0.9rem;
      border-radius: 9999px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .toggle-group button.active { background: var(--accent-blue); color: #04263a; }

    .starred-badge {
      display: none;
      align-items: center;
      gap: 0.4rem;
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid rgba(245, 158, 11, 0.4);
      color: var(--accent-amber);
      padding: 0.35rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 600;
    }

    /* Combined Filter & Progress Pills */
    .filter-pills {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .filter-btn {
      border: 1px solid var(--border-color);
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-muted);
      padding: 0.45rem 0.85rem;
      border-radius: 9999px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.2s ease;
      user-select: none;
    }

    .filter-btn:hover { background: rgba(255, 255, 255, 0.08); }
    .filter-btn.active { color: var(--text-main); border-color: rgba(255, 255, 255, 0.25); }
    .filter-btn.active.easy { background: rgba(52, 211, 153, 0.18); border-color: var(--accent-green); }
    .filter-btn.active.medium { background: rgba(245, 158, 11, 0.18); border-color: var(--accent-amber); }
    .filter-btn.active.hard { background: rgba(248, 113, 113, 0.18); border-color: var(--accent-red); }
    .filter-btn.active.unrated { background: rgba(148, 163, 184, 0.18); border-color: var(--text-muted); }

    .filter-count {
      background: rgba(0, 0, 0, 0.3);
      padding: 2px 7px;
      border-radius: 9999px;
      font-size: 0.75rem;
    }

    /* ---------- Carousel Wrapper ---------- */
    .carousel-container {
      position: relative;
      width: 100%;
      overflow: hidden;
      padding: 10px 0 20px;
      touch-action: pan-y;
      transition: opacity 0.25s ease;
    }

    .carousel-container.fading { opacity: 0; }

    .carousel-track {
      display: flex;
      transition: transform 0.35s cubic-bezier(0.25, 1, 0.5, 1);
      will-change: transform;
    }

    .carousel-slide {
      flex: 0 0 88%;
      margin: 0 1%;
      perspective: 1000px;
      opacity: 0.3;
      transition: opacity 0.35s ease, transform 0.35s ease;
      transform: scale(0.94);
    }

    .carousel-slide.active {
      opacity: 1;
      transform: scale(1);
    }

    /* Disappearance Animation */
    .carousel-slide.removing {
      opacity: 0 !important;
      transform: scale(0.6) translateY(-35px) !important;
      transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.4s ease-out !important;
    }

    /* Hide content on side peeking cards */
    .carousel-slide:not(.active) .word,
    .carousel-slide:not(.active) .ipa,
    .carousel-slide:not(.active) .lang-badge,
    .carousel-slide:not(.active) .listen-icon-btn,
    .carousel-slide:not(.active) .rating-row,
    .carousel-slide:not(.active) .end-content {
      visibility: hidden;
    }

    /* Card styling */
    .card-wrapper {
      position: relative;
      width: 100%;
      height: 270px;
    }

    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      cursor: pointer;
      transform-style: preserve-3d;
      transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .card-inner.flipped { transform: rotateX(180deg); }

    .face {
      position: absolute;
      inset: 0;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      transform-style: preserve-3d;
      border-radius: 1.25rem;
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      text-align: center;
      background: var(--card-bg);
      box-shadow: 0 15px 35px -10px rgba(0, 0, 0, 0.45);
    }

    /* Empêche absolument tous les enfants de la face cachée de traverser en 3D */
    .face * {
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
    }

    .face.back { transform: rotateX(180deg); }

    .face .lang-badge {
      position: absolute;
      top: 0.9rem;
      right: 1rem;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      text-transform: uppercase;
      transform: translateZ(1px);
    }

    .face .word { font-size: 1.6rem; font-weight: 700; line-height: 1.25; transform: translateZ(1px); }
    .face .ipa { font-size: 0.9rem; font-family: 'Courier New', monospace; color: var(--accent-blue); margin-top: 0.4rem; transform: translateZ(1px); }

    /* Listen Button (Plaqué sur la surface de chaque face) */
    .listen-icon-btn {
      position: absolute;
      top: 14px;
      left: 14px;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1px solid var(--border-color);
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-main);
      font-size: 1.05rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
      transform: translateZ(1px);
    }
    .listen-icon-btn:hover { background: rgba(56, 189, 248, 0.25); border-color: var(--accent-blue); }

    /* Rating Pills (Plaquées sur la surface de chaque face) */
    .rating-row {
      position: absolute;
      left: 50%;
      bottom: 14px;
      transform: translateX(-50%) translateZ(1px);
      display: flex;
      gap: 0.6rem;
    }
    .rating-pill {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 2px solid var(--border-color);
      font-size: 1.15rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      background: rgba(15, 23, 42, 0.7);
      transition: all 0.15s ease;
    }
    .rating-pill:hover { transform: translateY(-2px); }
    .rating-pill.easy.active { background: rgba(52, 211, 153, 0.3); border-color: var(--accent-green); }
    .rating-pill.medium.active { background: rgba(245, 158, 11, 0.3); border-color: var(--accent-amber); }
    .rating-pill.hard.active { background: rgba(248, 113, 113, 0.3); border-color: var(--accent-red); }

    /* End slide styling */
    .end-card {
      background: rgba(30, 41, 59, 0.9);
      border: 2px dashed var(--accent-purple);
      border-radius: 1.25rem;
      height: 270px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      text-align: center;
      box-shadow: 0 15px 35px -10px rgba(0, 0, 0, 0.45);
    }
    .end-content h2 { font-size: 1.4rem; margin-bottom: 0.5rem; color: var(--text-main); }
    .end-content p { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1.25rem; }
    .end-actions { display: flex; gap: 0.75rem; flex-wrap: wrap; justify-content: center; }
    .btn-action {
      padding: 0.65rem 1.2rem;
      border-radius: 9999px;
      border: 1px solid var(--border-color);
      background: var(--accent-purple);
      color: #0f172a;
      font-weight: 700;
      font-size: 0.88rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn-action:hover { transform: translateY(-2px); filter: brightness(1.1); }
    .btn-action.secondary { background: rgba(255, 255, 255, 0.1); color: var(--text-main); }

    /* Nav Controls */
    .nav-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      margin-top: 0.25rem;
    }

    .nav-arrow {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid var(--border-color);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-main);
      font-size: 1.3rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
    }
    .nav-arrow:hover:not(:disabled) { background: rgba(255, 255, 255, 0.12); border-color: var(--accent-blue); transform: scale(1.05); }
    .nav-arrow:disabled { opacity: 0.25; cursor: default; }

    .card-counter { color: var(--text-muted); font-size: 0.9rem; font-weight: 700; min-width: 100px; text-align: center; }

    /* Shortcuts hint */
    .shortcuts-hint {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.75rem;
      margin-top: 1.75rem;
      opacity: 0.75;
    }
    .shortcuts-hint kbd {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-color);
      border-radius: 5px;
      padding: 1px 6px;
      font-family: inherit;
      font-size: 0.75rem;
    }

    .empty-state {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--text-muted);
      background: rgba(30, 41, 59, 0.5);
      border: 1px dashed var(--border-color);
      border-radius: 1rem;
      margin: 1rem 0;
    }

    @media (max-width: 640px) {
      .top-left-nav { position: static; margin-bottom: 1rem; display: flex; }
      .shortcuts-hint { display: none; }
      .carousel-slide { flex: 0 0 90%; margin: 0 0.5%; }
    }
  </style>
</head>
<body>

  <div class="top-left-nav">
    <a id="back-btn" href="index.html" class="home-btn">← Back to Lists</a>
  </div>

  <div class="container">
    <header>
      <h1>📇 Study Cards</h1>
      <p class="subtitle">Flip, listen, and rate one card at a time</p>
    </header>

    <div class="controls">
      <div id="starredBadge" class="starred-badge"><span>⭐</span> Starred Words Only</div>

      <div class="control-row">
        <div class="control-group">
          <span class="group-label">Front</span>
          <div class="toggle-group" id="frontToggle">
            <button id="frontEnBtn" onclick="setDefaultFront('en')">🇬🇧 English</button>
            <button id="frontFrBtn" onclick="setDefaultFront('fr')">🇫🇷 Français</button>
          </div>
        </div>
      </div>

      <!-- Filter & Card Counts -->
      <div class="filter-pills">
        <button id="filterEasy" class="filter-btn easy active" onclick="toggleFilter('easy')">
          🟢 Easy <span id="countEasy" class="filter-count">0</span>
        </button>
        <button id="filterMedium" class="filter-btn medium active" onclick="toggleFilter('medium')">
          🟡 Medium <span id="countMedium" class="filter-count">0</span>
        </button>
        <button id="filterHard" class="filter-btn hard active" onclick="toggleFilter('hard')">
          🔴 Hard <span id="countHard" class="filter-count">0</span>
        </button>
        <button id="filterUnrated" class="filter-btn unrated active" onclick="toggleFilter('unrated')">
          ⚪ Unrated <span id="countUnrated" class="filter-count">0</span>
        </button>
      </div>
    </div>

    <!-- Carousel stage -->
    <div id="carouselContainer" class="carousel-container">
      <div id="carouselTrack" class="carousel-track"></div>
    </div>

    <div id="emptyState" class="empty-state" style="display:none;">
      No cards match the selected filters.
    </div>

    <!-- Navigation arrows below card -->
    <div id="navControls" class="nav-controls">
      <button id="prevBtn" class="nav-arrow" onclick="goToCard(currentIndex - 1)" title="Previous (←)">‹</button>
      <div id="cardCounter" class="card-counter">0 / 0</div>
      <button id="nextBtn" class="nav-arrow" onclick="goToCard(currentIndex + 1)" title="Next (→)">›</button>
    </div>

    <p class="shortcuts-hint">
      <kbd>↑</kbd> <kbd>↓</kbd> Flip &nbsp; <kbd>←</kbd> <kbd>→</kbd> Navigate &nbsp; <kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd> Rate Easy/Medium/Hard
    </p>
  </div>

  <script>
    const RATINGS_STORAGE_KEY = 'vocab_app_ratings_v1';
    const STARRED_STORAGE_KEY = 'vocab_app_starred_v1';
    const CURRENT_UNIT_STORAGE_KEY = 'vocab_app_current_unit';
    const DEFAULT_MODE_STORAGE_KEY = 'vocab_app_default_mode';
    const ACCENT_STORAGE_KEY = 'vocab_app_accent';
    const SPEED_STORAGE_KEY = 'vocab_app_speed';

    let fullUnitVocabulary = [];
    let deck = [];
    let currentIndex = 0;
    let defaultFace = 'en';
    let ratingsMap = {};
    let starredMap = {};
    let isStarredOnly = false;
    let unitKey = 'eim9_u1';
    let cardFlippedStates = [];

    // Active filters state
    let activeFilters = { easy: true, medium: true, hard: true, unrated: true };
    let isRatingBusy = false;

    // Touch swipe variables
    let touchStartX = 0;
    let touchEndX = 0;

    function getStored(key) {
      try {
        const saved = localStorage.getItem(key);
        return saved ? JSON.parse(saved) : {};
      } catch (e) {
        return {};
      }
    }

    function saveRating(cardId, rating) {
      ratingsMap[cardId] = rating;
      try { localStorage.setItem(RATINGS_STORAGE_KEY, JSON.stringify(ratingsMap)); } catch (e) {}
    }

    async function loadUnitFromUrl() {
      const urlParams = new URLSearchParams(window.location.search);
      let unitParam = urlParams.get('unit') || localStorage.getItem(CURRENT_UNIT_STORAGE_KEY) || 'eim9_u1.json';
      isStarredOnly = urlParams.get('starred') === 'true';

      const cleanUnitName = unitParam.replace(/^data\//, '');
      unitKey = cleanUnitName.replace('.json', '');
      const fileUrl = `data/${cleanUnitName}`;

      const backBtn = document.getElementById('back-btn');
      if (backBtn) backBtn.href = `index.html?unit=${encodeURIComponent(cleanUnitName)}`;

      if (isStarredOnly) {
        document.getElementById('starredBadge').style.display = 'inline-flex';
      }

      ratingsMap = getStored(RATINGS_STORAGE_KEY);
      starredMap = getStored(STARRED_STORAGE_KEY);
      defaultFace = localStorage.getItem(DEFAULT_MODE_STORAGE_KEY) || 'en';
      applyFrontToggleUI();

      try {
        const response = await fetch(fileUrl);
        if (!response.ok) throw new Error('File not found');
        const data = await response.json();

        fullUnitVocabulary = (data.words || []).map(item => {
          const fullId = `${unitKey}_${item.id}`;
          return {
            id: fullId,
            originalId: item.id,
            en: item.en || item.english || '',
            fr: item.fr || item.french || '',
            ipa: item.ipa || '',
            spoken: item.spoken || item.en || item.english || '',
          };
        });
      } catch (error) {
        console.warn('Could not load ' + fileUrl + ', using fallback dummy data.');
        fullUnitVocabulary = [
          { id: 'fallback_1', en: 'the adult', fr: "l'adulte", ipa: '', spoken: 'the adult' },
          { id: 'fallback_6', en: 'the teenager', fr: "l'adolescent", ipa: '', spoken: 'the teenager' },
          { id: 'fallback_7', en: 'the toddler', fr: 'le petit enfant', ipa: '', spoken: 'the toddler' },
          { id: 'fallback_16', en: 'annoyed', fr: 'énervé, agacé', ipa: '', spoken: 'annoyed' },
          { id: 'fallback_20', en: 'exhausted', fr: 'épuisé', ipa: '', spoken: 'exhausted' },
        ];
      }

      buildDeck(false);
      updateCounts();
    }

    function toggleFilter(type) {
      if (isRatingBusy) return;
      activeFilters[type] = !activeFilters[type];
      const btn = document.getElementById('filter' + type.charAt(0).toUpperCase() + type.slice(1));
      btn.classList.toggle('active', activeFilters[type]);
      
      triggerFadeChange(() => {
        buildDeck(true);
      });
    }

    function triggerFadeChange(callback) {
      const container = document.getElementById('carouselContainer');
      container.classList.add('fading');
      setTimeout(() => {
        callback();
        container.classList.remove('fading');
      }, 200);
    }

    function buildDeck(resetIndex = true) {
      deck = fullUnitVocabulary.filter(item => {
        if (isStarredOnly && !starredMap[item.id]) return false;
        const rating = ratingsMap[item.id] || 0;
        if (rating === 1) return activeFilters.easy;
        if (rating === 2) return activeFilters.medium;
        if (rating === 3) return activeFilters.hard;
        return activeFilters.unrated;
      });

      if (resetIndex || currentIndex >= deck.length) {
        currentIndex = 0;
      }

      cardFlippedStates = new Array(deck.length).fill(false);
      renderCarousel();
      updateCounts();
    }

    function updateCounts() {
      let easy = 0, medium = 0, hard = 0, unrated = 0;
      fullUnitVocabulary.forEach(item => {
        if (isStarredOnly && !starredMap[item.id]) return;
        const r = ratingsMap[item.id] || 0;
        if (r === 1) easy++;
        else if (r === 2) medium++;
        else if (r === 3) hard++;
        else unrated++;
      });

      document.getElementById('countEasy').textContent = easy;
      document.getElementById('countMedium').textContent = medium;
      document.getElementById('countHard').textContent = hard;
      document.getElementById('countUnrated').textContent = unrated;
    }

    function setDefaultFront(mode) {
      defaultFace = mode;
      localStorage.setItem(DEFAULT_MODE_STORAGE_KEY, mode);
      applyFrontToggleUI();
      triggerFadeChange(() => {
        renderCarousel();
      });
    }

    function applyFrontToggleUI() {
      document.getElementById('frontEnBtn').classList.toggle('active', defaultFace === 'en');
      document.getElementById('frontFrBtn').classList.toggle('active', defaultFace === 'fr');
    }

    function renderCarousel() {
      const track = document.getElementById('carouselTrack');
      const emptyState = document.getElementById('emptyState');
      const carouselContainer = document.getElementById('carouselContainer');
      const navControls = document.getElementById('navControls');

      track.innerHTML = '';

      if (deck.length === 0) {
        carouselContainer.style.display = 'none';
        navControls.style.display = 'none';
        emptyState.style.display = 'block';
        return;
      }

      carouselContainer.style.display = 'block';
      navControls.style.display = 'flex';
      emptyState.style.display = 'none';

      const getControlsHTML = (index, rating) => `
        <button class="listen-icon-btn" onclick="event.stopPropagation(); playCardAudio(${index});" title="Listen">🔊</button>
        <div class="rating-row">
          <div class="rating-pill easy ${rating === 1 ? 'active' : ''}" onclick="event.stopPropagation(); rateCard(${index}, 1);" title="Easy (1)">🟢</div>
          <div class="rating-pill medium ${rating === 2 ? 'active' : ''}" onclick="event.stopPropagation(); rateCard(${index}, 2);" title="Medium (2)">🟡</div>
          <div class="rating-pill hard ${rating === 3 ? 'active' : ''}" onclick="event.stopPropagation(); rateCard(${index}, 3);" title="Hard (3)">🔴</div>
        </div>
      `;

      deck.forEach((item, index) => {
        const slide = document.createElement('div');
        slide.className = `carousel-slide ${index === currentIndex ? 'active' : ''}`;
        
        const frontIsEnglish = defaultFace === 'en';
        const frontText = frontIsEnglish ? item.en : item.fr;
        const backText = frontIsEnglish ? item.fr : item.en;
        const rating = ratingsMap[item.id] || 0;
        const controlsMarkup = getControlsHTML(index, rating);

        slide.innerHTML = `
          <div class="card-wrapper">
            <div id="cardInner_${index}" class="card-inner ${cardFlippedStates[index] ? 'flipped' : ''}" onclick="flipCard(${index})">
              <div class="face front">
                <span class="lang-badge">${frontIsEnglish ? '[En]' : '[Fr]'}</span>
                <div class="word">${frontText}</div>
                <div class="ipa">${frontIsEnglish && item.ipa ? '/' + item.ipa + '/' : ''}</div>
                ${controlsMarkup}
              </div>
              <div class="face back">
                <span class="lang-badge">${frontIsEnglish ? '[Fr]' : '[En]'}</span>
                <div class="word">${backText}</div>
                <div class="ipa">${!frontIsEnglish && item.ipa ? '/' + item.ipa + '/' : ''}</div>
                ${controlsMarkup}
              </div>
            </div>
          </div>
        `;
        track.appendChild(slide);
      });

      const endSlide = document.createElement('div');
      endSlide.className = `carousel-slide ${currentIndex === deck.length ? 'active' : ''}`;
      endSlide.innerHTML = `
        <div class="end-card">
          <div class="end-content">
            <h2>🎉 Fin du tas !</h2>
            <p>Vous avez parcouru toutes les cartes sélectionnées.</p>
            <div class="end-actions">
              <button class="btn-action" onclick="shuffleAndRestart()">🔀 Mélanger et recommencer</button>
              <button class="btn-action secondary" onclick="restartDeck()">🔄 Recommencer</button>
            </div>
          </div>
        </div>
      `;
      track.appendChild(endSlide);

      updateCarouselPosition();
      updateNavControls();
    }

    function updateCarouselPosition() {
      const track = document.getElementById('carouselTrack');
      const slides = document.querySelectorAll('.carousel-slide');
      
      slides.forEach((slide, idx) => {
        slide.classList.toggle('active', idx === currentIndex);
      });

      const offset = 5 - (currentIndex * 90);
      track.style.transform = `translateX(${offset}%)`;
    }

    function updateNavControls() {
      document.getElementById('prevBtn').disabled = currentIndex === 0;
      document.getElementById('nextBtn').disabled = currentIndex >= deck.length;

      if (currentIndex === deck.length) {
        document.getElementById('cardCounter').textContent = `Fin / ${deck.length}`;
      } else {
        document.getElementById('cardCounter').textContent = `${currentIndex + 1} / ${deck.length}`;
      }
    }

    function goToCard(index) {
      if (isRatingBusy) return;
      if (index < 0 || index > deck.length) return;
      currentIndex = index;
      updateCarouselPosition();
      updateNavControls();

      if (currentIndex < deck.length && !cardFlippedStates[currentIndex] && defaultFace === 'en') {
        speakWord(deck[currentIndex].spoken || deck[currentIndex].en, 'en-GB');
      }
    }

    function shuffleAndRestart() {
      if (isRatingBusy) return;
      deck.sort(() => Math.random() - 0.5);
      currentIndex = 0;
      cardFlippedStates = new Array(deck.length).fill(false);
      triggerFadeChange(() => {
        renderCarousel();
      });
    }

    function restartDeck() {
      if (isRatingBusy) return;
      currentIndex = 0;
      cardFlippedStates = new Array(deck.length).fill(false);
      triggerFadeChange(() => {
        renderCarousel();
      });
    }

    function flipCard(index) {
      if (isRatingBusy) return;
      if (index !== currentIndex || index >= deck.length) return;
      cardFlippedStates[index] = !cardFlippedStates[index];
      const cardInner = document.getElementById(`cardInner_${index}`);
      if (cardInner) cardInner.classList.toggle('flipped', cardFlippedStates[index]);

      const item = deck[index];
      const frontIsEnglish = defaultFace === 'en';
      const nowShowingEnglish = cardFlippedStates[index] ? !frontIsEnglish : frontIsEnglish;
      if (nowShowingEnglish) {
        speakWord(item.spoken || item.en, 'en-GB');
      }
    }

    function speakWord(text, lang) {
      if (!('speechSynthesis' in window) || !text) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = lang;
      utterance.rate = parseFloat(localStorage.getItem(SPEED_STORAGE_KEY)) || 0.85;
      if (lang.startsWith('en')) {
        utterance.lang = localStorage.getItem(ACCENT_STORAGE_KEY) || 'en-GB';
      }
      window.speechSynthesis.speak(utterance);
    }

    function playCardAudio(index) {
      if (isRatingBusy) return;
      const item = deck[index];
      if (!item) return;
      const isFlipped = cardFlippedStates[index];
      const frontIsEnglish = defaultFace === 'en';
      const showingEnglish = isFlipped ? !frontIsEnglish : frontIsEnglish;
      if (showingEnglish) {
        speakWord(item.spoken || item.en, 'en-GB');
      } else {
        speakWord(item.fr, 'fr-FR');
      }
    }

    function rateCard(index, rating) {
      if (isRatingBusy) return;
      const item = deck[index];
      if (!item) return;

      saveRating(item.id, rating);
      updateCounts();

      const slides = document.querySelectorAll('.carousel-slide');
      const slide = slides[index];
      if (slide) {
        slide.querySelectorAll('.rating-pill.easy').forEach(el => el.classList.toggle('active', rating === 1));
        slide.querySelectorAll('.rating-pill.medium').forEach(el => el.classList.toggle('active', rating === 2));
        slide.querySelectorAll('.rating-pill.hard').forEach(el => el.classList.toggle('active', rating === 3));
      }

      const categoryMap = { 1: 'easy', 2: 'medium', 3: 'hard' };
      const isCategoryActive = activeFilters[categoryMap[rating]];

      if (!isCategoryActive) {
        isRatingBusy = true;
        
        setTimeout(() => {
          if (slide) {
            slide.classList.add('removing');
          }

          setTimeout(() => {
            deck = fullUnitVocabulary.filter(w => {
              if (isStarredOnly && !starredMap[w.id]) return false;
              const r = ratingsMap[w.id] || 0;
              if (r === 1) return activeFilters.easy;
              if (r === 2) return activeFilters.medium;
              if (r === 3) return activeFilters.hard;
              return activeFilters.unrated;
            });

            if (currentIndex >= deck.length && deck.length > 0) {
              currentIndex = deck.length - 1;
            }
            if (deck.length === 0) {
              currentIndex = 0;
            }

            cardFlippedStates = new Array(deck.length).fill(false);
            renderCarousel();
            isRatingBusy = false;
          }, 400);
        }, 450);
      }
    }

    // Touch Swipe Logic
    const carouselEl = document.getElementById('carouselContainer');
    carouselEl.addEventListener('touchstart', e => {
      touchStartX = e.changedTouches[0].screenX;
    }, { passive: true });

    carouselEl.addEventListener('touchend', e => {
      touchEndX = e.changedTouches[0].screenX;
      handleSwipe();
    }, { passive: true });

    function handleSwipe() {
      if (isRatingBusy) return;
      const diff = touchStartX - touchEndX;
      const swipeThreshold = 40;
      if (diff > swipeThreshold) {
        goToCard(currentIndex + 1);
      } else if (diff < -swipeThreshold) {
        goToCard(currentIndex - 1);
      }
    }

    // Keyboard navigation
    document.addEventListener('keydown', (e) => {
      const tag = document.activeElement ? document.activeElement.tagName : '';
      if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;

      if (e.code === 'ArrowUp' || e.code === 'ArrowDown') { e.preventDefault(); flipCard(currentIndex); }
      else if (e.code === 'ArrowLeft') { e.preventDefault(); goToCard(currentIndex - 1); }
      else if (e.code === 'ArrowRight') { e.preventDefault(); goToCard(currentIndex + 1); }
      else if (e.key === '1') { rateCard(currentIndex, 1); }
      else if (e.key === '2') { rateCard(currentIndex, 2); }
      else if (e.key === '3') { rateCard(currentIndex, 3); }
    });

    loadUnitFromUrl();
  </script>
</body>
</html>
